name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python scripts/parity_report.py --output reports/latest
      - run: python examples/bulk_dtu.py
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: parity-and-build-${{ matrix.python }}
          path: |
            reports/latest/
            dist/
          if-no-files-found: error
  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" numpy==1.26.0 scipy==1.12.0 pandas==2.1.0
      - run: python -m pytest
